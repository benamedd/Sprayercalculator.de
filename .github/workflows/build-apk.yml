name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      # ÉTAPE 1 : Génération de l'architecture du projet
      - name: Generate Project Files Silently
        run: |
          mkdir -p ./twa-project
          cd twa-project
          
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.benamedd.sprayercalculator",
            "host": "benamedd.github.io",
            "name": "Sprayer Calibration Tool",
            "shortName": "SprayerCalc",
            "themeColor": "#007bff",
            "backgroundColor": "#ffffff",
            "startUrl": "/Sprayercalculator.de/index.html",
            "iconUrl": "https://benamedd.github.io/Sprayercalculator.de/icons/icon-512x512.png",
            "maskableIconUrl": "https://benamedd.github.io/Sprayercalculator.de/icons/icon-512x512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "display": "standalone",
            "orientation": "portrait",
            "scionEnabled": true,
            "uuid": "sprayer-calc-unique-id",
            "shortcuts": [],
            "features": {},
            "alphaDependencies": false,
            "enableNotifications": false,
            "signingKey": { "path": "./android.keystore", "alias": "android" }
          }
          EOF
          
          yes "no" | bubblewrap update --skipCheck || true

      # ÉTAPE 2 : Correction de la ligne de syntaxe vide du Splashscreen
      - name: Fix Gradle Bug
        run: |
          # Cette commande remplace la variable vide par une valeur par défaut de 0 milliseconde
          sed -i 's/splashScreenFadeOutDuration: ,/splashScreenFadeOutDuration: 0,/g' twa-project/app/build.gradle

      # ÉTAPE 3 : Compilation robuste directe par Gradle
      - name: Compile APK with Gradle
        run: |
          cd twa-project
          chmod +x gradlew
          ./gradlew assembleDebug

      # ÉTAPE 4 : Upload de l'APK prêt à l'emploi
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: |
            twa-project/app/build/outputs/apk/debug/*-debug.apk
