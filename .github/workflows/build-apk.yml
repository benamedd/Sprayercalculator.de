name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cette action s'occupe de toute la configuration Android et Bubblewrap en tâche de fond
      - name: Build Android Package (APK)
        uses: jgcmarins/pwa-to-apk@v1
        with:
          manifest-url: 'https://benamedd.github.io/Sprayercalculator.de/manifest.json'

      # Récupération de l'APK généré automatiquement
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: app-release-unsigned.apk
