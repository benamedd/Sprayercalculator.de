name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      # ÉTAPE 1 : On crée un manifest minimaliste au format Android directement en 1 seconde
      - name: Generate Project Files Silently
        run: |
          mkdir -p ./twa-project
          cd twa-project
          
          # On écrit directement le fichier de configuration que Bubblewrap génère d'habitude
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.benamedd.sprayercalculator",
            "host": "benamedd.github.io",
            "name": "Sprayer Calibration Tool",
            "shortName": "SprayerCalc",
            "themeColor": "#007bff",
            "backgroundColor": "#ffffff",
            "startUrl": "/Sprayercalculator.de/index.html",
            "iconUrl": "https://benamedd.github.io/Sprayercalculator.de/icons/icon-512x512.png",
            "maskableIconUrl": "https://benamedd.github.io/Sprayercalculator.de/icons/icon-512x512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "display": "standalone",
            "orientation": "portrait",
            "scionEnabled": true,
            "uuid": "sprayer-calc-unique-id",
            "shortcuts": [],
            "features": {},
            "alphaDependencies": false,
            "enableNotifications": false,
            "signingKey": { "path": "./android.keystore", "alias": "android" }
          }
          EOF
          
          # On demande à bubblewrap de générer les dossiers Android SANS compiler (juste l'architecture)
          # L'argument --skipCheck évite les questions de mise à jour
          yes "no" | bubblewrap update --skipCheck || true

      # ÉTAPE 2 : On compile DIRECTEMENT avec Gradle (Zéro interactivité, vitesse maximale)
      - name: Compile APK with Gradle
        run: |
          cd twa-project
          # Si Bubblewrap a généré le dossier 'android-project', on y entre, sinon on reste à la racine du twa
          if [ -d "android-project" ]; then cd android-project; fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      # ÉTAPE 3 : On récupère l'APK généré par Gradle
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: |
            **/build/outputs/apk/debug/*-debug.apk
            **/build/outputs/apk/release/*-unsigned.apk
