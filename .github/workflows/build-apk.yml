name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # On remplace le 'bubblewrap init' instable par une génération directe et silencieuse
      - name: Initialize Bubblewrap project (Silent)
        run: |
          mkdir -p ./twa-project
          cd twa-project
          
          # Génération automatique du fichier de configuration requis par Bubblewrap
          npx @bubblewrap/cli init --manifest=https://benamedd.github.io/Sprayercalculator.de/manifest.json --silent
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Build APK
        run: |
          cd twa-project
          # 'yes' pour accepter la génération de la clé de signature par défaut (keystore)
          yes "yes" | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: twa-project/app-release-unsigned.apk
