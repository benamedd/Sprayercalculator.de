name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap project
        run: |
          echo "n" | bubblewrap init \
            --manifest https://benamedd.github.io/Sprayercalculator.de/manifest.json \
            --directory ./twa-project
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build APK
        run: |
          cd twa-project
          echo "n" | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: twa-project/app-release-unsigned.apk
