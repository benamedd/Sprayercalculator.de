name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # ÉTAPE CORRIGÉE : On force la création du projet Android directement à partir du JSON
      # sans passer par 'init' ou 'update' qui bloquent en boucle.
      - name: Generate Android Project Silently
        run: |
          # On demande à bubblewrap de générer les fichiers sans poser de questions sur la version
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation || true
          
          # Si la commande du dessus a besoin de réponses pour la clé, on lui envoie de vraies chaînes de caractères
          # "1.0.0" pour le versionName et "yes" pour le reste.
          echo -e "1.0.0\n1\nyes\npassword\npassword\npassword" | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: app-release-unsigned.apk
