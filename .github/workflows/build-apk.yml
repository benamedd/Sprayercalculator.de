name: Build APK - Sprayer Calibration Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Étape corrigée : On force Bubblewrap à générer le projet en mode non-interactif
      - name: Generate Android Project from Local Manifest
        run: |
          # yes "" permet de valider automatiquement par "Entrée" le numéro de version ou toute autre confirmation
          yes "" | bubblewrap update --manifest=twa-manifest.json --skipCheck
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      # Génération de l'APK
      - name: Build APK
        run: |
          yes "password" | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprayer-calc-apk
          path: app-release-unsigned.apk
